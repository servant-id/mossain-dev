<!doctype html>
<!--
  Trik standar untuk SPA (React Router) di GitHub Pages.
  GitHub Pages tidak tahu tentang client-side routing, jadi kalau ada yang
  refresh/buka langsung URL seperti /blog/artikel-x, GitHub Pages akan
  mencari file fisik di path itu dan gagal -> muncul 404.html ini.
  File ini lalu redirect balik ke index.html, membawa path aslinya lewat
  query string, supaya React Router bisa mengambil alih dan menampilkan
  halaman yang benar.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      var pathSegmentsToKeep = 1; // jumlah segmen path = nama repo, misal /mossain-app/
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
